name: tutoria

services:
  webapp:
    profiles:
    - prod
    build:
      context: ./webapp
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    ports:
      - "${WEBAPP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  webapp-dev:
    profiles:
      - dev
    build:
      context: ./webapp
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      - "${WEBAPP_DEV_PORT:-5173}:5173"
    volumes:
      - ./webapp:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
  ollama:
    build:
      context: ./backend/ollama
      dockerfile: Dockerfile
    container_name: rag-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama


  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./backend/ai_gateway/config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-cambia-esto}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-sk-cambia-esto-tambien}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    healthcheck:
      test: [
        "CMD",
        "python", "-c",
        "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"
      ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/6333"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: swagger-ui
    profiles:
      - dev
    ports:        
      - "${SWAGGER_PORT:-8081}:8080"
    volumes:
      - ./backend/API/openapi.yaml:/openapi.yaml:ro
    environment:
      SWAGGER_JSON: /openapi.yaml

volumes:
  ollama_data:
  qdrant_data:

    # Future backend integration:
    # Add a `backend` service here and expose its API on container port 8000.
    # When the backend service is added, set AI_GATEWAY_URL=http://litellm:4000
    # and AI_GATEWAY_API_KEY=${LITELLM_MASTER_KEY} in its environment.
    # Nginx in Webapp proxies /api/* to http://backend:8000/api/* over Compose DNS.
  redis_data:
