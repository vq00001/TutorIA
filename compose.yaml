name: tutoria

services:
  webapp:
    profiles:
    - prod
    build:
      context: ./webapp
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    ports:
      - "${WEBAPP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  webapp-dev:
    profiles:
      - dev
    build:
      context: ./webapp
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      - "${WEBAPP_DEV_PORT:-5173}:5173"
    volumes:
      - ./webapp:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development

  ollama:
    build:
      context: ./backend/ollama
      dockerfile: Dockerfile

    container_name: rag-ollama

    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama

    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: swagger-ui
    profiles:
      - dev
    ports:        
      - "${SWAGGER_PORT:-8081}:8080"
    volumes:
      - ./backend/API/openapi.yaml:/openapi.yaml:ro
    environment:
      SWAGGER_JSON: /openapi.yaml

volumes:
  ollama_data:
  qdrant_data:

    # Future backend integration:
    # Add a `backend` service here and expose its API on container port 8000.
  # Nginx in Webapp proxies /api/* to http://backend:8000/api/* over Compose DNS.
