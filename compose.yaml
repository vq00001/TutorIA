name: tutoria

x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB:-tutoria}
  POSTGRES_USER: ${POSTGRES_USER:-tutoria_migrator}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tutoria_local_migrator}

services:
  webapp:
    profiles:
    - prod
    build:
      context: ./webapp
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    ports:
      - "${WEBAPP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  webapp-dev:
    profiles:
      - dev
    build:
      context: ./webapp
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      - "${WEBAPP_DEV_PORT:-5173}:5173"
    volumes:
      - ./webapp:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development

  backend:
    build:
      context: ./backend/API
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      AI_GATEWAY_URL: http://litellm:4000
      AI_GATEWAY_API_KEY: ${LITELLM_MASTER_KEY:-sk-cambia-esto}

  ollama:
    build:
      context: ./backend/ollama
      dockerfile: Dockerfile
    container_name: rag-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama


  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./backend/ai_gateway/config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-cambia-esto}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-sk-cambia-esto-tambien}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    healthcheck:
      test: [
        "CMD",
        "python", "-c",
        "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"
      ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  db:
    image: &postgres-image pgvector/pgvector:0.8.7-pg18-bookworm@sha256:c29f30688a9ad961691bdf0ec1650717cc132a5814619d80f80463d6e4c42e47
    environment:
      <<: *postgres-env
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck: &postgres-healthcheck
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 24

  db-init:
    build: &backend-build
      context: ./backend
      dockerfile: db/Dockerfile
      target: db-init
    environment: &db-init-env
      <<: *postgres-env
      POSTGRES_HOST: db
      API_DB_PASSWORD: ${API_DB_PASSWORD:-tutoria_local_api}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:-tutoria_local_worker}
    depends_on:
      db:
        condition: service_healthy

  test-db:
    profiles: [test]
    image: *postgres-image
    environment: *postgres-env
    tmpfs:
      - /var/lib/postgresql
    healthcheck: *postgres-healthcheck

  test-db-init:
    profiles: [test]
    build: *backend-build
    environment:
      <<: *db-init-env
      POSTGRES_HOST: test-db
    depends_on:
      test-db:
        condition: service_healthy

  backend-test:
    profiles: [test]
    build:
      <<: *backend-build
      target: test
    environment:
      <<: *postgres-env
      POSTGRES_HOST: test-db
    depends_on:
      test-db:
        condition: service_healthy
      test-db-init:
        condition: service_completed_successfully

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: swagger-ui
    profiles:
      - dev
    ports:        
      - "${SWAGGER_PORT:-8081}:8080"
    volumes:
      - ./backend/API/contract/openapi.yaml:/openapi.yaml:ro
    environment:
      SWAGGER_JSON: /openapi.yaml

volumes:
  ollama_data:
  qdrant_data:

    # Future backend integration:
    # Add a `backend` service here and expose its API on container port 8000.
    # and AI_GATEWAY_API_KEY=${LITELLM_MASTER_KEY} in its environment.
    # Nginx in Webapp proxies /api/* to http://backend:8000/api/* over Compose DNS.
  redis_data:
  postgres_data:

