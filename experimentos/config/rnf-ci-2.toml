# RNF-CI-2 · Compatibilidad de formatos de archivo

[ejecucion]
arrancar_servicios = true     # Cada fase gestionada empieza con una base vacía.
reiniciar_servicios = true    # Detiene los contenedores al terminar y conserva los datos.
procesador = "cpu"            # "cpu", "gpu" o "both".

[escenario]
url = "http://127.0.0.1:18080"
# El orden es editable. Markdown es el control; TXT, PDF y DOCX son obligatorios.
formatos = ["md", "txt", "pdf", "docx"]

[tiempos]
ingesta_segundos = 120        # Plazo para observar el estado ready.
respuesta_segundos = 180      # Plazo para recibir y leer la respuesta RAG.
sondeo_segundos = 1
