# Wedapp/src/types/index.ts
# Wedapp/src/types/exams.ts


# Se deben de loggear los usuarios, tambien registrar y salir de la seccion.
# Los usuarios deben poder crear cursos, tambien salir de estos
# Se deben de poder invitar a otros usuarios a los cursos, y aceptar o rechazar invitaciones
# Los usuarios deben poder subir documentos a los cursos a los que pertenecen, y poder ver los documentos subidos por otros usuarios
# Los usuarios deben poder realizar consultas al LLM.
# Los usuarios deben poder generar examenes de un tema dado en el curso, y ver los examenes ya realizados y los pendientes
# Los usuarios deben poder ver el progreso de un curso, y ver el grafo de conocimiento del curso
# Los usuarios deben poder ver las notificaciones de eventos importantes en el curso
# Los usuarios deben poder ver los materiales generados de un curso
# Los usuarios deben poder ver la informacion de los documentos asociados al curso
# Los usuarios deben poder ver la informacion de los cursos y de los usuarios que estan en estos (informacion reducida de los otros usuarios)
# Los usuarios deben poder ver la informacion de su propio usuario (informacion completa)
# Los usuarios deben poder modificar la informacion de su propio usuario (informacion completa)
# Los usuarios deben poder eliminar su propio usuario
# Los usuarios deben poder configurar los cursos en los que tienen los permisos para hacerlo
# Los usuarios deben poder eliminar los documentos si es que tienen los permisos para hacerlo
# Los usuarios deben poder eliminar los cursos si es que tienen los permisos para hacerlo
# Los usuarios deben poder ver las conversaciones que han tenido con el LLM, retomarlas, y poder eliminar estas conversaciones
# En las respuestas del LLM, en el body, ademas de la respuesta a la pregunta como tal, se debe de indicar de si se usaron documentos para responder, y si es asi, cuales fueron estos documentos
# Se puede solicitar las preguntas de un examen, y posteriormente a que el usuario las responda, esta se envian al backend, en donde este las evalua y retorna la calificacion obtenida, ademas de la respuesta correcta a cada pregunta, y si es que se usaron documentos para responder, y si es asi, cuales fueron estos documentos
# Debe de exponerse un endpoint para indicar el estado del backend, para que el frontend pueda saber si este esta funcionando correctamente
# Debe de poder verse el estado de procesamiento de los documentos subidos, para que el frontend pueda mostrarle al usuario si es que estos ya estan listos para ser usados por el LLM
# Los usuarios deben poder ver el historial de sus actividades en el sistema, incluyendo las consultas realizadas al LLM, los documentos subidos, los examenes realizados, y cualquier otra actividad relevante.


openapi: 3.1.0
info:
  title: TutorIA API
  description: API para cursos, aprendizaje asistido por LLM y evaluación.
  version: 1.0.0
  license:
    name: Proprietary
servers:
  - url: /api/v1
    description: API relativa al proxy del frontend
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Courses
  - name: Documents
  - name: Conversations
  - name: Exams
  - name: Learning
  - name: Notifications
  - name: Activity
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Health]
      summary: Comprueba el estado del backend
      security: []
      responses:
        '200':
          description: Backend disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/register:
    post:
      tags: [Auth]
      summary: Registra un usuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Cuenta registrada con estado pendiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Inicia sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Cierra la sesión actual
      responses:
        '204':
          description: Sesión cerrada
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/email-verification/request:
    post:
      tags: [Auth]
      summary: Solicita la verificación de correo
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountEmailRequest'
      responses:
        '202':
          description: Solicitud recibida
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/email-verification/confirm:
    post:
      tags: [Auth]
      summary: Confirma la verificación de correo
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountTokenRequest'
      responses:
        '204':
          description: Código aplicado
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          description: Código inválido, vencido o consumido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/password-reset/request:
    post:
      tags: [Auth]
      summary: Solicita la recuperación de contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountEmailRequest'
      responses:
        '202':
          description: Solicitud recibida
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      summary: Confirma la recuperación de contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: Código aplicado
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          description: Código inválido, vencido o consumido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me:
    get:
      tags: [Users]
      summary: Obtiene el perfil completo del usuario actual
      responses:
        '200':
          description: Perfil del usuario
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Users]
      summary: Modifica el perfil del usuario actual
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Users]
      summary: Solicita el borrado de la cuenta propia
      responses:
        '202':
          description: Borrado solicitado y retirada aplicada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /dashboard/summary:
    get:
      tags: [Learning]
      summary: Obtiene el resumen del panel del usuario
      responses:
        '200':
          description: Resumen de aprendizaje
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummaryResponse'

  /courses:
    get:
      tags: [Courses]
      summary: Lista los cursos del usuario
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Cursos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
    post:
      tags: [Courses]
      summary: Crea un curso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseRequest'
      responses:
        '201':
          description: Curso creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /courses/{courseId}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [Courses]
      summary: Obtiene la información de un curso
      responses:
        '200':
          description: Curso y miembros resumidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Courses]
      summary: Configura un curso
      description: Requiere permisos de propietario o administrador del curso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCourseRequest'
      responses:
        '200':
          description: Curso actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Courses]
      summary: Solicita el borrado de la clase
      responses:
        '202':
          description: Borrado solicitado y retirada aplicada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /courses/{courseId}/leave:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    post:
      tags: [Courses]
      summary: Abandona un curso
      operationId: leaveCourse
      responses:
        '204':
          description: Usuario retirado del curso

  /courses/{courseId}/members:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [Courses]
      summary: Lista los miembros de un curso
      responses:
        '200':
          description: Miembros con información reducida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseMemberListResponse'
  /courses/{courseId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Courses]
      summary: Configura permisos de un miembro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
      responses:
        '204':
          description: Membresía actualizada
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /courses/{courseId}/invitations:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    post:
      tags: [Courses]
      summary: Invita a un usuario a un curso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRequest'
      responses:
        '202':
          description: Solicitud recibida con respuesta uniforme para cualquier correo válido
        '403':
          $ref: '#/components/responses/Forbidden'

  /invitations:
    get:
      tags: [Courses]
      summary: Lista las invitaciones pendientes del usuario actual
      responses:
        '200':
          description: Invitaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationListResponse'
  /invitations/{invitationId}:
    parameters:
      - name: invitationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Courses]
      summary: Acepta o rechaza una invitación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationDecisionRequest'
      responses:
        '200':
          description: Invitación procesada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'

  /courses/{courseId}/jobs/{jobId}:
    get:
      tags: [Jobs]
      summary: Consulta un trabajo propio de la clase
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Estado del trabajo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /courses/{courseId}/documents:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [Documents]
      summary: Lista los documentos asociados al curso
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: afterCreatedAt
          in: query
          schema: { type: string, format: date-time }
        - name: afterId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Documentos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPageResponse'
    post:
      tags: [Documents]
      summary: Sube documentos al curso de forma idempotente
      description: El lote admite hasta 20 archivos de texto plano o Markdown y 20 MiB en total.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: string
                    format: binary
      responses:
        '202':
          description: Documentos aceptados para procesamiento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUploadResponse'
        '409':
          description: La clave ya se usó con otro lote
        '413':
          description: El lote supera el límite de tamaño
        '429':
          description: Cuota de carga agotada
        '415':
          description: Tipo de archivo no soportado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /courses/{courseId}/documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [Documents]
      summary: Obtiene la información de un documento visible
      responses:
        '200':
          description: Documento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Documents]
      summary: Elimina un documento
      description: Requiere ser quien subió el documento o coordinar una clase activa.
      responses:
        '204':
          description: Documento eliminado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /courses/{courseId}/documents/{documentId}/download:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [Documents]
      summary: Descarga el archivo original
      responses:
        '200':
          description: Bytes originales del documento
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /courses/{courseId}/documents/{documentId}/status:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [Documents]
      summary: Consulta el estado de procesamiento de un documento
      responses:
        '200':
          description: Estado de procesamiento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentStatusResponse'

  /courses/{courseId}/conversations:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [Conversations]
      summary: Lista las conversaciones del usuario en el curso
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: beforeUpdatedAt
          in: query
          schema: { type: string, format: date-time }
        - name: beforeId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Conversaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListResponse'
    post:
      tags: [Conversations]
      summary: Crea una conversación y encola la primera pregunta
      parameters:
        - $ref: '#/components/parameters/ChatIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
      responses:
        '202':
          description: Pregunta aceptada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatAcceptedResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: Cuota de generación agotada

  /courses/{courseId}/conversations/{conversationId}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - name: conversationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Conversations]
      summary: Consulta el historial de una conversación
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: afterSequence
          in: query
          schema: { type: integer, minimum: 0, maximum: 9223372036854775807, default: 0 }
      responses:
        '200':
          description: Mensajes de la conversación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
    delete:
      tags: [Conversations]
      summary: Elimina una conversación
      responses:
        '204':
          description: Conversación eliminada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /courses/{courseId}/conversations/{conversationId}/messages:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - name: conversationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Conversations]
      summary: Envía una pregunta a una conversación existente
      parameters:
        - $ref: '#/components/parameters/ChatIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
      responses:
        '202':
          description: Pregunta aceptada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatAcceptedResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: Cuota de generación agotada

  /courses/{courseId}/exams:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [Exams]
      summary: Lista los exámenes propios
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Exámenes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamSummaryListResponse'
    post:
      tags: [Exams]
      summary: Encola la generación de un examen
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateExamRequest'
      responses:
        '202':
          description: Generación aceptada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamAcceptedResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: Cuota de generación agotada

  /courses/{courseId}/exams/{examId}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/ExamId'
    get:
      tags: [Exams]
      summary: Obtiene las preguntas de un examen
      responses:
        '200':
          description: Preguntas sin respuestas correctas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamResponse'

  /courses/{courseId}/exams/{examId}/attempts:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/ExamId'
    post:
      tags: [Exams]
      summary: Inicia o recupera el intento vigente
      responses:
        '200':
          description: Intento y resultado disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamResultResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /courses/{courseId}/exams/{examId}/attempts/{attemptId}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/ExamId'
      - name: attemptId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Exams]
      summary: Consulta el estado y resultado del intento
      responses:
        '200':
          description: Intento y resultado disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamResultResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /courses/{courseId}/exams/{examId}/attempts/{attemptId}/submissions:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/ExamId'
      - name: attemptId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
