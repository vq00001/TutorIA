# Wedapp/src/types/exams.ts


# Se deben de loggear los usuarios, tambien registrar y salir de la seccion.
# Los usuarios deben poder crear cursos, tambien salir de estos
# Se deben de poder invitar a otros usuarios a los cursos, y aceptar o rechazar invitaciones
# Los usuarios deben poder subir documentos a los cursos a los que pertenecen, y poder ver los documentos subidos por otros usuarios
# Los usuarios deben poder realizar consultas al LLM.
# Los usuarios deben poder generar examenes de un tema dado en el curso, y ver los examenes ya realizados y los pendientes
# Los usuarios deben poder ver el progreso de un curso, y ver el grafo de conocimiento del curso
# Los usuarios deben poder ver las notificaciones de eventos importantes en el curso
# Los usuarios deben poder ver los materiales generados de un curso
# Los usuarios deben poder ver la informacion de los documentos asociados al curso
# Los usuarios deben poder ver la informacion de los cursos y de los usuarios que estan en estos (informacion reducida de los otros usuarios)
# Los usuarios deben poder ver la informacion de su propio usuario (informacion completa)
# Los usuarios deben poder modificar la informacion de su propio usuario (informacion completa)
# Los usuarios deben poder eliminar su propio usuario
# Los usuarios deben poder configurar los cursos en los que tienen los permisos para hacerlo
# Los usuarios deben poder eliminar los documentos si es que tienen los permisos para hacerlo
# Los usuarios deben poder eliminar los cursos si es que tienen los permisos para hacerlo
# Los usuarios deben poder ver las conversaciones que han tenido con el LLM, retomarlas, y poder eliminar estas conversaciones
# En las respuestas del LLM, en el body, ademas de la respuesta a la pregunta como tal, se debe de indicar de si se usaron documentos para responder, y si es asi, cuales fueron estos documentos
# Se puede solicitar las preguntas de un examen, y posteriormente a que el usuario las responda, esta se envian al backend, en donde este las evalua y retorna la calificacion obtenida, ademas de la respuesta correcta a cada pregunta, y si es que se usaron documentos para responder, y si es asi, cuales fueron estos documentos
# Debe de exponerse un endpoint para indicar el estado del backend, para que el frontend pueda saber si este esta funcionando correctamente
# Debe de poder verse el estado de procesamiento de los documentos subidos, para que el frontend pueda mostrarle al usuario si es que estos ya estan listos para ser usados por el LLM
# Los usuarios deben poder ver el historial de sus actividades en el sistema, incluyendo las consultas realizadas al LLM, los documentos subidos, los examenes realizados, y cualquier otra actividad relevante.


openapi: 3.1.0
info:
  title: TutorIA API
  description: API para cursos, aprendizaje asistido por LLM y evaluación.
  version: 1.0.0
  license:
    name: Proprietary
servers:
  - url: /api/v1
    description: API relativa al proxy del frontend
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Courses
  - name: Documents
  - name: Conversations
  - name: Exams
  - name: Learning
  - name: Notifications
  - name: Activity
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Health]
      summary: Comprueba el estado del backend
      security: []
      responses:
        '200':
          description: Backend disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/register:
    post:
      tags: [Auth]
      summary: Registra un usuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Cuenta registrada con estado pendiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Inicia sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Cierra la sesión actual
      responses:
        '204':
          description: Sesión cerrada
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me:
    get:
      tags: [Users]
      summary: Obtiene el perfil completo del usuario actual
      responses:
        '200':
          description: Perfil del usuario
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Users]
      summary: Modifica el perfil del usuario actual
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Users]
      summary: Elimina la cuenta del usuario actual
      responses:
        '204':
          description: Cuenta eliminada

  /dashboard/summary:
    get:
      tags: [Learning]
      summary: Obtiene el resumen del panel del usuario
      responses:
        '200':
          description: Resumen de aprendizaje
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummaryResponse'

  /courses:
    get:
      tags: [Courses]
      summary: Lista los cursos del usuario
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Cursos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
    post:
      tags: [Courses]
      summary: Crea un curso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseRequest'
      responses:
        '201':
          description: Curso creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /courses/{courseId}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [Courses]
      summary: Obtiene la información de un curso
      responses:
        '200':
          description: Curso y miembros resumidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Courses]
      summary: Configura un curso
      description: Requiere permisos de propietario o administrador del curso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCourseRequest'
      responses:
        '200':
          description: Curso actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Courses]
      summary: Elimina un curso
      description: Requiere permisos de propietario o administrador del curso.
      responses:
        '204':
          description: Curso eliminado
        '403':
          $ref: '#/components/responses/Forbidden'
  /courses/{courseId}/leave:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    post:
      tags: [Courses]
      summary: Abandona un curso
      operationId: leaveCourse
      responses:
        '204':
          description: Usuario retirado del curso

  /courses/{courseId}/members:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [Courses]
      summary: Lista los miembros de un curso
      responses:
        '200':
          description: Miembros con información reducida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberListResponse'
  /courses/{courseId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Courses]
      summary: Configura permisos de un miembro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
      responses:
        '200':
          description: Miembro actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /courses/{courseId}/invitations:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    post:
      tags: [Courses]
      summary: Invita a un usuario a un curso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRequest'
      responses:
        '201':
          description: Invitación creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /invitations:
    get:
      tags: [Courses]
      summary: Lista las invitaciones pendientes del usuario actual
      responses:
        '200':
          description: Invitaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationListResponse'
  /invitations/{invitationId}:
    parameters:
      - name: invitationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Courses]
      summary: Acepta o rechaza una invitación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationDecisionRequest'
      responses:
        '200':
          description: Invitación procesada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'

  /courses/{courseId}/documents:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [Documents]
      summary: Lista los documentos asociados al curso
      responses:
        '200':
          description: Documentos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'
    post:
      tags: [Documents]
      summary: Sube documentos al curso
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    format: binary
      responses:
        '202':
          description: Documentos aceptados para procesamiento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'
        '415':
          description: Tipo de archivo no soportado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /courses/{courseId}/documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [Documents]
      summary: Obtiene la información de un documento
      responses:
        '200':
          description: Documento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
    delete:
      tags: [Documents]
      summary: Elimina un documento
      description: Requiere permisos de propietario o administrador del curso.
      responses:
        '204':
          description: Documento eliminado
        '403':
          $ref: '#/components/responses/Forbidden'

  /courses/{courseId}/documents/{documentId}/status:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [Documents]
      summary: Consulta el estado de procesamiento de un documento
      responses:
        '200':
          description: Estado de procesamiento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentStatusResponse'

  /courses/{courseId}/conversations:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [Conversations]
      summary: Lista las conversaciones del usuario en el curso
      responses:
        '200':
          description: Conversaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListResponse'
    post:
      tags: [Conversations]
      summary: Crea una conversación y realiza una consulta al LLM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
      responses:
        '201':
          description: Conversación con la respuesta del LLM
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'

  /courses/{courseId}/conversations/{conversationId}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - name: conversationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Conversations]
      summary: Retoma una conversación
      responses:
        '200':
          description: Mensajes de la conversación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
    delete:
      tags: [Conversations]
      summary: Elimina una conversación
      responses:
        '204':
          description: Conversación eliminada

  /courses/{courseId}/conversations/{conversationId}/messages:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - name: conversationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Conversations]
      summary: Envía una pregunta a una conversación existente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
      responses:
        '201':
          description: Respuesta del LLM
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /courses/{courseId}/exams:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [Exams]
      summary: Lista exámenes pendientes y realizados
      responses:
        '200':
          description: Exámenes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamSummaryListResponse'
    post:
      tags: [Exams]
      summary: Genera un examen sobre un tema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateExamRequest'
      responses:
        '201':
          description: Examen generado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamResponse'

  /courses/{courseId}/exams/{examId}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/ExamId'
    get:
      tags: [Exams]
      summary: Obtiene las preguntas de un examen
      responses:
        '200':
          description: Preguntas sin respuestas correctas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamResponse'

  /courses/{courseId}/exams/{examId}/submissions:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/ExamId'
    post:
      tags: [Exams]
      summary: Envía y evalúa las respuestas de un examen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitExamRequest'
      responses:
        '200':
          description: Resultado evaluado con respuestas correctas y fuentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamResultResponse'

  /courses/{courseId}/progress:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [Learning]
      summary: Obtiene el progreso del curso
      responses:
        '200':
          description: Progreso y conceptos dominados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseProgressResponse'

  /courses/{courseId}/knowledge-graph:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [Learning]
      summary: Obtiene el grafo de conocimiento del curso
      responses:
        '200':
          description: Grafo en formato compatible con Graphology
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeGraphResponse'

  /courses/{courseId}/materials:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [Learning]
      summary: Lista los materiales generados del curso
      responses:
        '200':
          description: Materiales
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedMaterialListResponse'

  /courses/{courseId}/notifications:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [Notifications]
      summary: Lista notificaciones de eventos del curso
      responses:
        '200':
          description: Notificaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'

  /notifications:
    get:
      tags: [Notifications]
      summary: Lista notificaciones del usuario actual
      responses:
        '200':
          description: Notificaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'

  /activity:
    get:
      tags: [Activity]
      summary: Lista el historial de actividad del usuario
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: type
          in: query
          schema:
            type: string
            enum: [login, logout, course, invitation, document, llm_query, exam, profile]
      responses:
        '200':
          description: Historial de actividades
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityListResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CourseId:
      name: courseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExamId:
      name: examId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    Unauthorized:
      description: Autenticación requerida o inválida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: El usuario no tiene permisos suficientes
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: El recurso ya existe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: Datos inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServiceUnavailable:
      description: Servicio no disponible
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        message: { type: string }
        details:
          type: object
          additionalProperties: true
    HealthResponse:
      type: object
      required: [status, timestamp, services]
      properties:
        status: { type: string, enum: [ok, degraded] }
        timestamp: { type: string, format: date-time }
        version: { type: string }
        services:
          type: object
          additionalProperties:
            type: string
            enum: [up, down, degraded]
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 8, maxLength: 128 }
        displayName: { type: string, minLength: 1, maxLength: 100 }
    RegisterResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, nickname, email, displayName, status]
          properties:
            id: { type: string, format: uuid }
            nickname: { type: string }
            email: { type: string, format: email }
            displayName: { type: string }
            status: { type: string, const: pending }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 8, maxLength: 128 }
    AuthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [accessToken, tokenType, expiresIn, user]
          properties:
            accessToken: { type: string }
            tokenType: { type: string, enum: [Bearer] }
            expiresIn: { type: integer }
            user: { $ref: '#/components/schemas/LoginUser' }
    LoginUser:
      type: object
      required: [id, nickname, email, displayName, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        nickname: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        status: { type: string, enum: [pending, active] }
        createdAt: { type: string, format: date-time }
    CurrentUserResponse:
      type: object
      required: [data]
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/LoginUser'
            - type: object
              required: [emailVerifiedAt]
              properties:
                emailVerifiedAt: { type: [string, 'null'], format: date-time }
    User:
      type: object
      required: [id, email, displayName, role, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { type: string, enum: [student, teacher, admin] }
        avatarUrl: { type: string, format: uri, nullable: true }
        createdAt: { type: string, format: date-time }
    UserResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/User' }
    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email }
        avatarUrl: { type: string, format: uri, nullable: true }
        password: { type: string, format: password, minLength: 8 }
    Course:
      type: object
      required: [id, name, subject, progress, color, icon, nextTopic, lastActivity]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        objectives: { type: string }
        subject: { type: string }
        progress: { type: number, minimum: 0, maximum: 100 }
        color: { type: string }
        icon: { type: string }
        nextTopic: { type: string }
        lastActivity: { type: string }
        ownerId: { type: string, format: uuid }
