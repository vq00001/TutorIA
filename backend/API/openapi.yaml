components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ChatIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    CourseId:
      name: courseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExamId:
      name: examId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    Unauthorized:
      description: Autenticación requerida o inválida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: El usuario no tiene permisos suficientes
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: El recurso ya existe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: Datos inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServiceUnavailable:
      description: Servicio no disponible
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        message: { type: string }
        details:
          type: object
          additionalProperties: true
    HealthResponse:
      type: object
      required: [status, timestamp, services]
      properties:
        status: { type: string, enum: [ok, degraded] }
        timestamp: { type: string, format: date-time }
        version: { type: string }
        services:
          type: object
          additionalProperties:
            type: string
            enum: [up, down, degraded]
    AccountEmailRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    AccountTokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true }
    PasswordResetRequest:
      allOf:
        - $ref: '#/components/schemas/AccountTokenRequest'
        - type: object
          required: [password]
          properties:
            password: { type: string, format: password, minLength: 8, maxLength: 128, writeOnly: true }
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 8, maxLength: 128 }
        displayName: { type: string, minLength: 1, maxLength: 100 }
    RegisterResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, nickname, email, displayName, status]
          properties:
            id: { type: string, format: uuid }
            nickname: { type: string }
            email: { type: string, format: email }
            displayName: { type: string }
            status: { type: string, const: pending }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 8, maxLength: 128 }
    AuthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [accessToken, tokenType, expiresIn, user]
          properties:
            accessToken: { type: string }
            tokenType: { type: string, enum: [Bearer] }
            expiresIn: { type: integer }
            user: { $ref: '#/components/schemas/LoginUser' }
    LoginUser:
      type: object
      required: [id, nickname, email, displayName, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        nickname: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        status: { type: string, enum: [pending, active] }
        createdAt: { type: string, format: date-time }
    CurrentUserResponse:
      type: object
      required: [data]
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/LoginUser'
            - type: object
              required: [emailVerifiedAt]
              properties:
                emailVerifiedAt: { type: [string, 'null'], format: date-time }
    User:
      type: object
      required: [id, email, displayName, role, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { type: string, enum: [student, teacher, admin] }
        avatarUrl: { type: string, format: uri, nullable: true }
        createdAt: { type: string, format: date-time }
    UserResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/User' }
    UpdateUserRequest:
      type: object
      required: [displayName]
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }

    Course:
      type: object
      required: [id, name, description, objectives, subject, color, icon, status, myRole, ownerId, rowVersion]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        objectives: { type: string }
        subject: { type: string }
        color: { type: string }
        icon: { type: string }
        status: { type: string, enum: [active, archived] }
        myRole: { type: string, enum: [coordinator, student] }
        ownerId: { type: [string, 'null'], format: uuid }
        rowVersion: { type: integer, minimum: 1 }
        members: { type: array, items: { $ref: '#/components/schemas/CourseMember' } }
    CourseResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Course' }
    CourseListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Course' }
        meta: { $ref: '#/components/schemas/Pagination' }
    CreateCourseRequest:
      type: object
      required: [name, description, objectives]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string }
        objectives: { type: string }
        subject: { type: string, maxLength: 150, default: '' }
        color: { type: string, enum: [mauve, blue, green, peach, pink, yellow, teal, lavender], default: mauve }
        icon: { type: string, maxLength: 16, default: '✦' }
    UpdateCourseRequest:
      type: object
      required: [rowVersion]
      minProperties: 2
      additionalProperties: false
      properties:
        rowVersion: { type: integer, minimum: 1, maximum: 9223372036854775806 }
        name: { type: string, minLength: 1, maxLength: 100 }
