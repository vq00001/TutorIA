[project]
name = "rag_backend"
version = "0.1.0"
description = "Backend de TutorIA con PostgreSQL y pgvector"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0,<2",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<2.1",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
