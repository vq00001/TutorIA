[project]
name = "rag_backend"
version = "0.1.0"
description = "TutorIA: API, worker y persistencia PostgreSQL/pgvector"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "argon2-cffi>=23.1,<26",
    "pydantic[email]>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "cryptography>=44,<47",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
    "httpx>=0.28,<1",
    "hypothesis>=6.120,<7",
    "pytest-cov>=6,<8",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"experiments/retrieval/run.py" = ["E402"]
"experiments/token_estimation/calibrate.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
