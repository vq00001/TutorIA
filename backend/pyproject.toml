[project]
name = "rag_backend"
version = "0.1.0"
description = "Backend de TutorIA con PostgreSQL y pgvector"
requires-python = ">=3.10"
dependencies = [
    "argon2-cffi>=25.1,<26",
    "fastapi>=0.115,<0.125",
    "pydantic[email]>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.32,<1",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0.28,<2.1",
    "requests>=2.32,<3",
    "ftfy",
    "pymupdf",
    "pymupdf4llm",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
# Starlette TestClient usa este alias de AnyIO solo como anotación.
filterwarnings = [
    'ignore:The anyio\.abc\.BlockingPortal alias is deprecated:DeprecationWarning:starlette\.testclient',
]
