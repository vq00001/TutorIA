[project]
name = "rag_backend"
version = "0.1.0"
description = "Pipeline RAG local con Ollama y Qdrant"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0,<2",
    "qdrant-client>=1.12,<2",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
